version: '3.8'

services:
  # =========================================================================
  # Project Drishti - FastAPI Backend Service (AI / CV Inference Engine)
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: drishti_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:////app/backend/drishti.db
    volumes:
      - ./data:/app/data
      - drishti_db_data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =========================================================================
  # Project Drishti - Next.js Command Center Dashboard
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drishti_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  drishti_db_data:
    driver: local
